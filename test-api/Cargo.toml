[package]
name = "mvsep-api-tester"
version = "0.1.0"
edition = "2021"
description = "MVSep API tester - CLI tool for testing music separation API"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/AntheaLaffy/mvsep-rs"
homepage = "https://github.com/AntheaLaffy/mvsep-rs"
authors = ["AntheaLaffy"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dotenvy = "0.15"
anyhow = "1"
colored = "2"
dirs = "5"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
